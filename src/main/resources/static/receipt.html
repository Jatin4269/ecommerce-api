<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete — Shelf Steal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .receipt-wrap{
            min-height: 100vh;
            display:flex; flex-direction: column; align-items:center;
            padding: 110px 20px 80px;
        }

        .status-card{
            width: min(380px, 92vw);
            background: var(--ink);
            color: var(--white);
            padding: 28px 24px 60px;
            position: relative;
            z-index: 2;
        }
        .status-top{
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom: 30px;
        }
        .status-back{
            font-family: var(--font-head); font-size: 11px; letter-spacing: 0.04em;
            color: var(--white); text-decoration:none;
        }
        .status-badge{
            font-family: var(--font-head); font-size: 10px; letter-spacing: 0.04em;
            background: var(--yellow); color: var(--ink); padding: 4px 10px;
        }
        .status-plan{ font-size: 12px; opacity: 0.7; margin-bottom: 6px; }
        .status-row{
            display:flex; justify-content:space-between; align-items: baseline;
        }
        .status-label{ font-size: 13px; opacity: 0.85; }
        .status-total{ font-family: var(--font-head); font-size: 30px; }
        .status-check{
            display:flex; align-items:center; gap:8px; margin-top: 18px;
            font-family: var(--font-head); font-size: 11px; letter-spacing: 0.03em;
            color: var(--green);
        }
        .status-check svg{ width:14px; height:14px; }

        .receipt-stage{
            width: min(340px, 88vw);
            overflow: hidden;
            position: relative;
            margin-top: -30px;
            z-index: 1;
        }

        .receipt-paper{
            background: var(--white);
            padding: 34px 22px 40px;
            font-family: "Space Mono", monospace;
            font-size: 12px;
            color: var(--ink);
            box-shadow: 0 24px 40px rgba(23,20,15,0.28);
            transform: translateY(-100%);
            animation: printOut 1.1s 0.3s cubic-bezier(0.65,0,0.35,1) forwards;
            clip-path: polygon(
                    0% 0%, 100% 0%, 100% 97%,
                    95% 100%, 90% 97%, 85% 100%, 80% 97%, 75% 100%, 70% 97%, 65% 100%,
                    60% 97%, 55% 100%, 50% 97%, 45% 100%, 40% 97%, 35% 100%, 30% 97%,
                    25% 100%, 20% 97%, 15% 100%, 10% 97%, 5% 100%, 0% 97%
            );
        }

        @keyframes printOut{
            from{ transform: translateY(-100%); }
            to{ transform: translateY(0); }
        }

        .rp-logo{
            text-align:center; font-family: var(--font-head); font-size: 14px;
            letter-spacing: 0.04em; margin-bottom: 4px;
        }
        .rp-sub{
            text-align:center; font-size: 10px; opacity: 0.6; margin-bottom: 20px;
            letter-spacing: 0.05em;
        }
        .rp-divider{
            border: none; border-top: 1px dashed rgba(23,20,15,0.35); margin: 14px 0;
        }
        .rp-line{
            display:flex; justify-content:space-between; padding: 3px 0;
        }
        .rp-item{
            display:flex; justify-content:space-between; padding: 6px 0;
        }
        .rp-item-name{ max-width: 65%; }
        .rp-item-meta{ opacity: 0.6; font-size: 11px; }
        .rp-total-row{
            display:flex; justify-content:space-between;
            font-weight: 700; font-size: 14px; padding: 8px 0;
        }
        .rp-footer-note{
            text-align:center; font-size: 10px; opacity: 0.65; margin-top: 20px; line-height: 1.7;
        }
        .rp-barcode{
            height: 40px; margin: 22px 0 10px;
            background: repeating-linear-gradient(
                    90deg, var(--ink) 0, var(--ink) 2px, transparent 2px, transparent 5px,
                    var(--ink) 5px, var(--ink) 6px, transparent 6px, transparent 10px
            );
        }
        .rp-barcode-num{
            text-align:center; font-size: 10px; letter-spacing: 0.15em;
        }

        .receipt-actions{
            display:flex; flex-direction: column; gap: 10px;
            width: min(340px, 88vw);
            margin-top: 24px;
        }
        .rc-btn{
            padding: 14px; border: 3px solid var(--ink); background: var(--white);
            font-family: var(--font-head); font-size: 12px; letter-spacing: 0.04em;
            cursor: pointer; text-align:center; text-decoration:none; color: var(--ink);
        }
        .rc-btn.primary{ background: var(--ink); color: var(--white); }
        .rc-btn.primary:hover{ background: var(--blue); }
        .rc-btn:hover{ background: var(--cream); }

        .no-order{
            text-align:center; font-family: var(--font-head); font-size: 13px; padding: 60px 20px;
        }
        .no-order a{ color: var(--blue); }

        @media (prefers-reduced-motion: reduce){
            .receipt-paper{ animation: none; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header class="site-header">
    <span class="brand">SHELF STEAL</span>
</header>

<main class="receipt-wrap" id="receiptWrap">
    <!-- populated by receipt.js -->
</main>

<script src="receipt.js"></script>
</body>
</html>
